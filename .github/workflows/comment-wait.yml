name: comment-wait
# Started by the build run right after upload. Sleeps until the video's publish
# moment, then posts the parked vote comment (the cron in comment.yml stays as backup).
on:
  workflow_dispatch:
    inputs:
      publish_at:
        description: 'ISO UTC publish time of the scheduled video'
        required: true
permissions:
  contents: write
jobs:
  wait:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - run: |
          T=$(date -u -d "${{ github.event.inputs.publish_at }}" +%s)
          N=$(date -u +%s)
          S=$((T + 15 - N))
          echo "sleeping ${S}s until publish_at ${{ github.event.inputs.publish_at }} + 15s"
          if [ "$S" -gt 0 ]; then sleep "$S"; fi
  post:
    needs: wait
    runs-on: ubuntu-latest
    concurrency:
      group: post-pending-comment
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          for i in 1 2 3 4 5 6 7 8; do
            python3 pipeline/post_pending.py
            git config user.name "mashmash-bot"
            git config user.email "bot@users.noreply.github.com"
            git add -A story_state*.json
            git diff --cached --quiet || { git commit -m "comment posted $(date -u +%F-%H%M)"; git pull --rebase --autostash; git push; }
            if ! grep -q pending_comment story_state*.json; then break; fi
            sleep 30
          done
