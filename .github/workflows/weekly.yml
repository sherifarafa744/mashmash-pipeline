name: weekly-compilation
on:
  schedule:
    # Twice a week (Wed + Sat). Built early, scheduled on YouTube for
    # 11:00 UTC (arc1) and 11:30 UTC (arc2) = 13:00 / 13:30 Africa/Cairo.
    # 4 fires from 07:00 UTC (3-4h lead), guard lets only one through per day.
    - cron: '0,15,30,45 7 * * 3,6'
  workflow_dispatch: {}
permissions:
  contents: write
  actions: write
concurrency:
  group: weekly-compilation
  cancel-in-progress: false
jobs:
  weekly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: when
        run: |
          echo "arc1=$(date -u +%Y-%m-%d)T11:00:00.000Z" >> "$GITHUB_OUTPUT"
          echo "arc2=$(date -u +%Y-%m-%d)T11:30:00.000Z" >> "$GITHUB_OUTPUT"
      - id: guard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          last=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/weekly.yml/runs?status=completed&per_page=10" \
            | jq -r '[(.workflow_runs // [])[] | select(.conclusion=="success" and .id != '"$GITHUB_RUN_ID"')] | .[0].created_at // ""')
          if [ -n "$last" ] && [ $(( $(date -u +%s) - $(date -u -d "$last" +%s) )) -lt 86400 ]; then
            echo "a weekly run already succeeded at $last (<1d ago); skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.guard.outputs.skip != 'true'
        with: { python-version: '3.12' }
      - if: steps.guard.outputs.skip != 'true'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-core
      - if: steps.guard.outputs.skip != 'true'
        run: python pipeline/weekly.py
        env:
          ARC_DIR: arc1
          PUBLISH_AT: ${{ steps.when.outputs.arc1 }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      - if: steps.guard.outputs.skip != 'true'
        run: python pipeline/weekly.py
        env:
          ARC_DIR: arc2
          PUBLISH_AT: ${{ steps.when.outputs.arc2 }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      - if: steps.guard.outputs.skip != 'true'
        run: |
          git config user.name "mashmash-bot"
          git config user.email "bot@users.noreply.github.com"
          for f in weekly_state.json weekly_episode.json; do [ -f "$f" ] && git add "$f"; done
          git commit -m "weekly state $(date -u +%F)" || true
          git pull --rebase --autostash
          git push
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-thumb
          path: weekly_thumb*.jpg
          if-no-files-found: ignore
      - continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for t in "${{ steps.when.outputs.arc1 }}" "${{ steps.when.outputs.arc2 }}"; do
            [ -n "$t" ] && gh workflow run comment-wait.yml -f publish_at="$t" || true
          done
