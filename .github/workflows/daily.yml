name: daily-episode
on:
  schedule:
    # Episodes are BUILT ahead and scheduled on YouTube (publishAt) for the
    # 11:00, 14:00, 17:00, 20:00 Africa/Cairo slots (= 9,12,15,18 UTC).
    # Build fires start 4h before each slot (05/08/11/14 UTC), so Gemini can
    # be retried for hours; it never ships a weaker episode to hit a slot
    # (see pipeline/retry.py). GitHub delays fires up to ~40 min.
    # 4 fires per slot; pipeline/slot.py guard lets only the first through.
    - cron: '0,15,30,45 5,8,11,14 * * *'
  workflow_dispatch:
    inputs:
      arc:
        description: 'Which story arc to run (1 or 2)'
        default: '1'
concurrency:
  group: daily-episode
  cancel-in-progress: false
permissions:
  contents: write
  actions: write
jobs:
  episode:
    runs-on: ubuntu-latest
    env:
      # 2 parallel story arcs alternate by slot: arc1 at 9+15 UTC, arc2 at 12+18 UTC.
      # Exception 2026-11-25: the 18:00 UTC run is arc1 part 3 (user-confirmed plan).
      ARC: ${{ github.event.inputs.arc || '' }}
    steps:
      - uses: actions/checkout@v4
      - name: post any parked vote comment whose video is public now
        continue-on-error: true
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          python3 pipeline/post_pending.py
          git config user.name "mashmash-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A story_state*.json
          git diff --cached --quiet || { git commit -m "comment posted $(date -u +%F-%H%M)"; git pull --rebase --autostash; git push; }
      - id: arc
        run: |
          PUBLISH_AT=$(python3 pipeline/slot.py target)
          H=$(date -u -d "$PUBLISH_AT" +%H)
          if [ -n "$ARC" ]; then arc="$ARC"; else
            case $H in 09|15) arc=1;; 12|18) arc=2;; *) arc=1;; esac
          fi
          echo "publish_at=$PUBLISH_AT" >> "$GITHUB_OUTPUT"
          echo "arc=$arc" >> "$GITHUB_OUTPUT"
          echo "story_state=story_state_arc${arc}.json" >> "$GITHUB_OUTPUT"
          echo "Running arc $arc for slot $PUBLISH_AT"
      - id: milestone
        # The review agent commits milestone.json (pending: true) when Studio
        # crosses a milestone; this slot then runs the celebration Short
        # instead of a story episode, and the archive step clears the flag.
        run: |
          if [ -f milestone.json ] && [ "$(jq -r '.pending // false' milestone.json)" = "true" ]; then
            echo "milestone celebration pending: this slot runs the celebration Short"
            echo "celebrate=true" >> "$GITHUB_OUTPUT"
          fi
      - id: guard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$(python3 pipeline/slot.py guard)" = "skip" ]; then
            echo "a run already succeeded for slot ${{ steps.arc.outputs.publish_at }}; skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.guard.outputs.skip != 'true'
        with: { python-version: '3.12' }
      - if: steps.guard.outputs.skip != 'true'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-core
      - if: steps.guard.outputs.skip != 'true' && steps.milestone.outputs.celebrate == 'true'
        run: python pipeline/celebrate.py
        env:
          STORY_STATE: milestone_tmp.json
          ARC_DIR: celebrations
          PUBLISH_AT: ${{ steps.arc.outputs.publish_at }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      - if: steps.guard.outputs.skip != 'true' && steps.milestone.outputs.celebrate != 'true'
        run: python pipeline/main.py
        env:
          STORY_STATE: ${{ steps.arc.outputs.story_state }}
          ARC_DIR: arc${{ steps.arc.outputs.arc }}
          PUBLISH_AT: ${{ steps.arc.outputs.publish_at }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      - if: steps.guard.outputs.skip != 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Cross-post kit: final mp4 + caption as a public Release (the video
          # is already public on YouTube). Keep the 20 newest, delete the rest.
          python pipeline/social.py
          TAG="reel-$(date -u +%F-%H%M)"
          cp episode_final.mp4 /tmp/reel.mp4
          gh release create "$TAG" /tmp/reel.mp4 social/caption.txt \
            --title "$TAG" --notes "cross-post kit. YouTube publish time (UTC): ${{ steps.arc.outputs.publish_at }}. Post elsewhere AT or AFTER this time." --target "$GITHUB_SHA"
          gh release list --limit 100 --json tagName --jq '.[20:][].tagName' \
            | while read t; do gh release delete "$t" --cleanup-tag -y; done
      - if: steps.guard.outputs.skip != 'true'
        env:
          ARC_DIR: arc${{ steps.arc.outputs.arc }}
          STORY_STATE: ${{ steps.arc.outputs.story_state }}
        run: |
          git config user.name "mashmash-bot"
          git config user.email "bot@users.noreply.github.com"
          if [ -f milestone.json ]; then
            mkdir -p episodes/celebrations
            cp episode.json "episodes/celebrations/$(date -u +%F-%H%M).json"
            git rm -q milestone.json
            git add -A episode.json episodes/ milestone.json
            git commit -m "milestone celebration $(date -u +%F-%H%M)" || true
          else
            mkdir -p "episodes/$ARC_DIR"
            cp episode.json "episodes/$ARC_DIR/ep$(python3 -c "import json;print(json.load(open('episode.json'))['part'])").json"
            PUBLISH_AT="${{ steps.arc.outputs.publish_at }}" python3 pipeline/log_episode.py
            git add "$STORY_STATE" episode.json episodes/ episode_log.jsonl
            git commit -m "episode state $ARC_DIR $(date -u +%F-%H%M)" || true
          fi
          git pull --rebase --autostash
          git push
      - if: steps.guard.outputs.skip != 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Post the vote comment right at the publish moment (not 10-25 min later).
          gh workflow run comment-wait.yml -f publish_at="${{ steps.arc.outputs.publish_at }}"
