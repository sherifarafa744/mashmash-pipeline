name: fallback-test
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  hold-test:
    # Proves: Gemini down near the slot => run FAILS with HOLD, no weaker fallback used, nothing written.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: script hold (invalid Gemini key, slot 34 min away, 25 min reserved)
        env:
          GEMINI_API_KEY: invalid-key-for-test
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          STORY_STATE: story_state_arc1.json
        run: |
          export PUBLISH_AT=$(date -u -d '+34 minutes' +%Y-%m-%dT%H:%M:%S.000Z)
          cp episode.json /tmp/episode_before.json
          set +e
          python pipeline/gen_script.py 2>&1 | tee /tmp/hold.log
          code=${PIPESTATUS[0]}
          set -e
          echo "exit code: $code"
          grep -c "Cloudflare" /tmp/hold.log || true
          grep "HOLD" /tmp/hold.log
          [ "$code" != "0" ]
          cmp episode.json /tmp/episode_before.json && echo "episode.json untouched"
      - name: voice hold (invalid key)
        env:
          GEMINI_API_KEY: invalid-key-for-test
        run: |
          export PUBLISH_AT=$(date -u -d '+28 minutes' +%Y-%m-%dT%H:%M:%S.000Z)
          set +e
          python pipeline/gen_voice.py 2>&1 | tee /tmp/hold2.log
          code=${PIPESTATUS[0]}
          set -e
          echo "exit code: $code"
          grep "HOLD" /tmp/hold2.log
          [ "$code" != "0" ]
          ! grep -q "edge-tts" /tmp/hold2.log && echo "no edge-tts fallback used"
