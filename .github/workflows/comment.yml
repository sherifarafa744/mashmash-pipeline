name: post-pending-comment
on:
  schedule:
    # GitHub's scheduler is best-effort (fires arrive late or are dropped; the
    # 09/12/15/18 UTC fires of the first version never ran). The repo is public,
    # so minutes are free: fire every 10 min from 09:00 to 20:59 UTC. The script
    # is idempotent: it posts only for a public video with a parked comment.
    - cron: '3,13,23,33,43,53 9-20 * * *'
  workflow_dispatch: {}
concurrency:
  group: post-pending-comment
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  comment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python pipeline/post_pending.py
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      - run: |
          git config user.name "mashmash-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A story_state*.json
          git diff --cached --quiet || { git commit -m "comment posted $(date -u +%F-%H%M)"; git pull --rebase --autostash; git push; }
