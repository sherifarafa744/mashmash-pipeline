name: post-pending-comment
on:
  schedule:
    # Just after each publish slot (09/12/15/18 UTC); repeated because GitHub
    # delays fires. Idempotent: posts only for a public video that still has a
    # parked comment.
    - cron: '3,12,25,40 9,12,15,18 * * *'
  workflow_dispatch: {}
concurrency:
  group: post-pending-comment
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  comment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python pipeline/post_pending.py
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      - run: |
          git config user.name "mashmash-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A story_state*.json
          git diff --cached --quiet || { git commit -m "comment posted $(date -u +%F-%H%M)"; git pull --rebase --autostash; git push; }
