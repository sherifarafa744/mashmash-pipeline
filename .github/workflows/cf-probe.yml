name: cf-probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  p:
    runs-on: ubuntu-latest
    env:
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
    steps:
      - name: one tiny image request (shows quota state)
        run: |
          date -u
          curl -s -m 120 -o /tmp/o.json -w "HTTP %{http_code}\n" -X POST "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/ai/run/@cf/black-forest-labs/flux-1-schnell" -H "Authorization: Bearer $CF_API_TOKEN" -H "Content-Type: application/json" -d '{"prompt":"a small orange cat","steps":1}'
          head -c 400 /tmp/o.json | sed 's/"image":"[^"]*/"image":"(omitted)/'
